<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crear cuenta — VERSA</title>
<meta name="description" content="Crea tu cuenta en VERSA. Gratis para músicos.">
<link rel="stylesheet" href="/assets/css/site.css">
<link rel="stylesheet" href="/assets/css/app.css">
</head>
<body data-page="registro">
<div id="siteNav"></div>

<main class="page">
  <div class="wrap">
    <div class="auth">
      <div class="page__head">
        <p class="eyebrow">Crear cuenta</p>
        <h1 class="h2">Entra a VERSA</h1>
        <p class="lead">Gratis para músicos. Tú decides qué se muestra de tu perfil y puedes corregirlo o retirarlo cuando quieras.</p>
      </div>

      <div id="authMsg"></div>

      <form id="registerForm" class="form" novalidate>
        <fieldset class="field" style="border:0;padding:0;margin:0">
          <legend class="field__label">¿Cómo participas?</legend>
          <div class="roles" style="margin-top:8px">
            <label class="role"><input type="radio" name="role" value="musico" checked>
              <strong>Músico emergente</strong><span>Busco estudios, salas y colaboradores</span></label>
            <label class="role"><input type="radio" name="role" value="estudio">
              <strong>Estudio o sala de ensayo</strong><span>Quiero llegar a nuevos clientes</span></label>
            <label class="role"><input type="radio" name="role" value="manager">
              <strong>Manager</strong><span>Busco talento con trayectoria real</span></label>
            <label class="role"><input type="radio" name="role" value="disquera">
              <strong>Disquera o sello</strong><span>Quiero decidir con información verificada</span></label>
          </div>
        </fieldset>

        <div class="field">
          <label for="dname">Nombre artístico o de la organización</label>
          <input class="input" id="dname" name="dname" type="text" required minlength="2" maxlength="80" autocomplete="name">
        </div>
        <div class="field">
          <label for="email">Correo</label>
          <input class="input" id="email" name="email" type="email" required autocomplete="email" inputmode="email">
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input class="input" id="password" name="password" type="password" required minlength="8" autocomplete="new-password">
          <small>Mínimo 8 caracteres.</small>
        </div>

        <label class="check">
          <input type="checkbox" id="consent" required>
          <span>Acepto los <a href="/legal/terminos/" target="_blank" rel="noopener">términos de uso</a> y la
            <a href="/legal/privacidad/" target="_blank" rel="noopener">política de tratamiento de datos</a>.
            Entiendo que mi perfil no se publica hasta que yo lo decida.</span>
        </label>

        <button class="btn btn--lg" type="submit" id="submitBtn">Crear mi cuenta</button>
      </form>

      <p class="auth__alt">¿Ya tienes cuenta? <a href="/ingresar/">Ingresar</a></p>
    </div>
  </div>
</main>

<div id="siteFooter"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/assets/js/core/config.js"></script>
<script src="/assets/js/core/app.js"></script>
<script src="/assets/js/core/ui.js"></script>
<script src="/assets/js/pages/auth.js"></script>
</body>
</html>
