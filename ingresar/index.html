<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ingresar — VERSA</title>
<meta name="description" content="Ingresa a tu cuenta de VERSA.">
<link rel="stylesheet" href="/assets/css/site.css">
<link rel="stylesheet" href="/assets/css/app.css">
</head>
<body data-page="ingresar">
<div id="siteNav"></div>

<main class="page">
  <div class="wrap">
    <div class="auth">
      <div class="page__head">
        <p class="eyebrow">Ingresar</p>
        <h1 class="h2">Bienvenido de vuelta</h1>
      </div>

      <div id="authMsg"></div>

      <form id="loginForm" class="form" novalidate>
        <div class="field">
          <label for="email">Correo</label>
          <input class="input" id="email" name="email" type="email" required autocomplete="email" inputmode="email">
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input class="input" id="password" name="password" type="password" required autocomplete="current-password">
        </div>
        <button class="btn btn--lg" type="submit" id="submitBtn">Ingresar</button>
        <button class="link-btn" type="button" id="forgotBtn">Olvidé mi contraseña</button>
      </form>

      <p class="auth__alt">¿Aún no tienes cuenta? <a href="/registro/">Crear cuenta</a></p>
    </div>
  </div>
</main>

<div id="siteFooter"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/assets/js/core/config.js"></script>
<script src="/assets/js/core/app.js"></script>
<script src="/assets/js/core/ui.js"></script>
<script src="/assets/js/pages/auth.js"></script>
</body>
</html>
